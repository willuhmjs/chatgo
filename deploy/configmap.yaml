# Non-secret runtime config. SSO points at Authelia (client `chatgo`, redirect URI
# https://chat2.will.net/api/auth/oidc/callback — register it in Authelia's config).
# PUBLIC_URL must match the ingress host: it enables Secure cookies and builds the OIDC redirect.
apiVersion: v1
kind: ConfigMap
metadata:
  name: chatgo-config
  namespace: chatgo
data:
  PUBLIC_URL: https://chat2.will.net
  OIDC_ISSUER: https://sso.will.net
  OIDC_CLIENT_ID: chatgo
  OIDC_DISPLAY_NAME: Authelia
  REGISTRATION: approve
  DATA_DIR: /data

  # X-Forwarded-For/Proto is only trusted from these CIDRs. Without this the
  # app cannot tell real client IPs from a spoofed XFF header (login rate
  # limiting and audit logs key off it). k3s reality — pick your Traefik mode:
  #   - Traefik as a normal pod (default k3s)      → pod CIDR: 10.42.0.0/16
  #   - Traefik pinned to host network (single node) → 127.0.0.1/32
  TRUSTED_PROXIES: 10.42.0.0/16

  # Outbound-URL guard: this deployment talks to public HTTPS providers only,
  # so loopback egress is denied (defense-in-depth vs SSRF via provider URLs).
  # The docker-compose/`docker run` default stays true for local SearXNG.
  # In-cluster SearXNG does NOT need loopback — service DNS resolves into the
  # k3s service CIDR; allow that via TRUSTED_URL_NETS below if you enable it.
  ALLOW_LOOPBACK: "false"

  # Optional extras (uncomment + fill):
  # TASK_MODEL: "<providerID>:<modelID>"   # cheap model for titles/summaries
  # SEARXNG_URL: http://searxng.<ns>.svc:8080   # enables web-search toggle (needs TRUSTED_URL_NETS for the svc CIDR)
  # TRUSTED_URL_NETS: "10.43.0.0/16"      # k3s *service* CIDR for in-cluster SearXNG/providers (pods = 10.42.0.0/16)
  # ADMIN_EMAIL: you@example.com          # accounts with this email are auto-created as admin
  #                                        # (bootstraps admin deterministically instead of first-signup-wins)
  # SECURE_COOKIE: "true"                 # force Secure flag on the session cookie;
  #                                        # default (unset) = auto: https PUBLIC_URL or X-Forwarded-Proto
