# Template. Copy to secret.yaml (gitignored), fill in, `kubectl apply -f`. Deliberately NOT in
# kustomization.yaml so a GitOps controller will not prune it.
# NOTE: SESSION_SECRET keys both session signing AND at-rest AES-GCM encryption of provider
# API keys — rotating it logs everyone out and makes stored provider keys unreadable.
# SESSION_SECRET must be ≥64 hex chars (32 bytes) — the app refuses to boot with less.
# Generate: openssl rand -hex 32   (32 random bytes → 64 hex chars)
apiVersion: v1
kind: Secret
metadata:
  name: chatgo-secrets
  namespace: chatgo
stringData:
  SESSION_SECRET: "<openssl rand -hex 32 → 64 hex chars>"
  OIDC_CLIENT_SECRET: "<plaintext of the chatgo Authelia client secret>"
